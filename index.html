<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KanbanOps</title>
    <script>
      // Paint the right theme before the app loads (see src/theme/theme.js).
      (function () {
        var t = null
        try { t = localStorage.getItem('kanbanops:theme') } catch (e) {}
        // 'system' = follow the OS. Nothing stored = this browser has not
        // heard from the server yet: dark, the theme KanbanOps always had,
        // until /api/me says otherwise (no flash of light for existing users).
        if (t === 'system') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        } else if (t !== 'light') {
          t = 'dark'
        }
        document.documentElement.dataset.theme = t
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
