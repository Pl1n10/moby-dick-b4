server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — any unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must be revalidated on every load: after a deploy the old
    # hashed bundles it points to no longer exist, and a cached copy would
    # give a blank page. The hashed /assets/* can stay cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to the Express container
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
