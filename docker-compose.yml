services:
  # ── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: moby-db
    environment:
      POSTGRES_DB: moby
      POSTGRES_USER: moby
      POSTGRES_PASSWORD: moby
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moby"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Express API ───────────────────────────────────────
  api:
    build: ./backend
    container_name: moby-api
    environment:
      DATABASE_URL: postgresql://moby:moby@db:5432/moby
      PORT: "3000"
      # Auth (Entra ID) — leave AUTH_ENABLED=false until the IT team
      # provisions the app registration. See backend/.env.example.
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_API_AUDIENCE: ${AZURE_API_AUDIENCE:-}
      # Assignment notifications — Power Automate webhook URL. Empty = disabled.
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://kanbanops.mauden.com}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Nginx (frontend + reverse proxy) ─────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      # Vite inlines VITE_* into the bundle at build time. Compose forwards
      # them as build args; values come from the .env file next to this
      # compose file (or shell env). Defaults keep demo mode.
      args:
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-false}
        VITE_AZURE_TENANT_ID: ${VITE_AZURE_TENANT_ID:-}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID:-}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI:-http://localhost:5173}
        VITE_AZURE_API_SCOPE: ${VITE_AZURE_API_SCOPE:-}
    container_name: moby-nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
