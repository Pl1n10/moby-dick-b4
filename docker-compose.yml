services:
  # ── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: moby-db
    environment:
      POSTGRES_DB: moby
      POSTGRES_USER: moby
      POSTGRES_PASSWORD: moby
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moby"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Express API ───────────────────────────────────────
  api:
    build: ./backend
    container_name: moby-api
    environment:
      DATABASE_URL: postgresql://moby:moby@db:5432/moby
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Nginx (frontend + reverse proxy) ─────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: moby-nginx
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
